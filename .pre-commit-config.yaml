repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: check-yaml
          - id: check-toml
          - id: check-added-large-files
            args: [--maxkb=2000]

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.17.5
      hooks:
          - id: ruff-check
            args: [--fix]
          - id: ruff-format

    - repo: local
      hooks:
          # The public mypy hook runs in an isolated environment that can't see the project's packages.
          - id: mypy
            name: mypy
            entry: uv run mypy
            language: system
            types: [python]
            pass_filenames: false
